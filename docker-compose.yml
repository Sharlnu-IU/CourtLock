services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: courtlock
      POSTGRES_PASSWORD: courtlock
      POSTGRES_DB: courtlock
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtlock -d courtlock"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://courtlock:courtlock@db:5432/courtlock
    command: ["sh", "-c", "alembic upgrade head && python -m courtlock.seed"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://courtlock:courtlock@db:5432/courtlock
      STAFF_API_KEY: dev-staff-key
      HOLD_TTL_SECONDS: "300"
      MAX_ACTIVE_BOOKINGS: "3"
      BOOKING_HORIZON_DAYS: "90"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # docker compose --profile test run --rm test   (runs the suite on Python 3.11)
  test:
    profiles: ["test"]
    build:
      context: .
      target: dev
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://courtlock:courtlock@db:5432/courtlock_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
